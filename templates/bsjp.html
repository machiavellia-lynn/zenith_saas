<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8"/>
<script>(function(){var t=localStorage.getItem('zenith-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zenith — BSJP Algo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/sidebar.css">
<link rel="stylesheet" href="/static/components.css">
<style>
html, body { height: 100%; }
body.sidebar-layout { overflow: hidden; }
.main-content { overflow: hidden; display: flex; flex-direction: column; }
.page-body { overflow: hidden; }
.data-table { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.data-table-body { flex: 1; overflow-y: auto; min-height: 0; }
/* Rank | Ticker | CM | RSM | TP | SL | Last | Setup */
.bsjp-cols { grid-template-columns: 44px 1.2fr 1.35fr 0.55fr 0.68fr 0.68fr 0.82fr 1.45fr; }
</style>
</head>
<body class="sidebar-layout">
{% include 'sidebar.html' %}

<div class="main-content">
  <div class="page-header">
    <div>
      <div class="page-subtitle">Breakout · Sideways · Trending · Pullback Scanner</div>
      <h1 class="page-title">BSJP Algo</h1>
    </div>
    <div class="page-header-actions">
      <div class="ihsg-pill">
        <span class="ihsg-pill-label">IHSG</span>
        <span class="ihsg-pill-price" id="ihsgPrice">—</span>
        <span class="ihsg-pill-gain" id="ihsgGain">—</span>
      </div>
    </div>
  </div>

  <div class="page-body">
    <div class="stat-cards-4">
      <div class="stat-card">
        <div class="stat-card-label">SM total</div>
        <div class="stat-card-value up" id="statSM">—</div>
        <div class="stat-card-sub" id="statSMSub">— emiten</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">BM total</div>
        <div class="stat-card-value down" id="statBM">—</div>
        <div class="stat-card-sub" id="statBMSub">— emiten</div>
      </div>
      <div class="stat-card emph">
        <div class="stat-card-label">Clean money</div>
        <div class="stat-card-value" id="statCM">—</div>
        <div class="stat-card-sub">net accumulation</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Signals</div>
        <div class="stat-card-value ink" id="statCount">—</div>
        <div class="stat-card-sub" id="statDate">—</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="toolbar-search">
        <span class="toolbar-search-icon">⌕</span>
        <input type="text" id="tickerSearch" placeholder="Cari ticker..." autocomplete="off"/>
        <button id="searchClear" style="display:none;background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0">✕</button>
      </div>
      <div class="toolbar-divider"></div>
      <div id="datePicker"></div>
      <div class="toolbar-divider"></div>
      <!-- Setup filter pills -->
      <div class="setup-pills" id="setupPills"></div>
      <div class="toolbar-spacer"></div>
      <span style="font-family:var(--font-mono);font-size:11.5px;color:var(--muted)" id="resultCount"></span>
    </div>

    <div class="data-table">
      <div class="data-table-head bsjp-cols">
        <div style="color:var(--muted);font-size:11px">Rank</div>
        <div>Ticker</div>
        <div class="th-sortable active" data-col="cm" style="text-align:right">Clean Money <span class="sort-arrow">↓</span></div>
        <div class="th-sortable" data-col="rsm" style="text-align:right">RSM <span class="sort-arrow">↓</span></div>
        <div style="text-align:right">TP</div>
        <div style="text-align:right">SL</div>
        <div style="text-align:right">Last</div>
        <div style="text-align:center">Setup</div>
      </div>
      <div class="data-table-body" id="tableBody">
        <div style="padding:48px 0;text-align:center;color:var(--muted);font-size:13px">Loading...</div>
      </div>
      <div class="data-table-foot">
        <span id="rowCount">—</span>
        <span class="foot-sort" id="sortLabel">Sort: Clean Money ↓</span>
      </div>
    </div>
  </div>
</div>

<script src="/static/zenith-utils.js"></script>
<script>
(function(){
var SETUPS = ['BREAKOUT_MA5','BREAKOUT_SIDEWAYS','TRENDING_PREV_HIGH','CROSS_MA5','PULLBACK_BB','PULLBACK_MA5'];
var S = {rows:[], filtered:[], date:'', sortCol:'cm', sortAsc:false, q:'', setup:null};
var today = window.todayLocal();
S.date = today;

/* Date Picker — single date */
var sdp = new window.StockbitDatePicker('datePicker', {
  from: today, to: today,
  onChange: function(from) { S.date = from; load(); }
});
fetch('/api/last-date').then(function(r){return r.json();}).then(function(d){if(d.date){var iso=window.DD_MM_YYYYtoISO(d.date.replace(/\//g,'-'));S.date=iso;sdp.setDates(iso,iso);load();}}).catch(function(){});

window.loadIHSGBadge(document.getElementById('ihsgPrice'), document.getElementById('ihsgGain'));

/* Setup pills */
var pillsContainer = document.getElementById('setupPills');
SETUPS.forEach(function(s) {
  var div = document.createElement('div');
  div.className = 'setup-pill';
  div.dataset.setup = s;
  div.textContent = s;
  var sc = window.BSJP_STYLE[s] || {};
  div.addEventListener('click', function() {
    var wasActive = S.setup === s;
    S.setup = wasActive ? null : s;
    document.querySelectorAll('.setup-pill').forEach(function(p) {
      var ps = window.BSJP_STYLE[p.dataset.setup] || {};
      var active = p.dataset.setup === S.setup;
      p.classList.toggle('active', active);
      p.style.background = active ? (ps.col || '#3a6b58') : 'var(--surface2)';
      p.style.color       = active ? '#fff' : 'var(--text-dim)';
      p.style.borderColor = active ? (ps.col || '#3a6b58') : 'var(--border)';
    });
    filter();
  });
  pillsContainer.appendChild(div);
});

/* Search */
var sEl = document.getElementById('tickerSearch'), cBtn = document.getElementById('searchClear');
sEl.addEventListener('input', function() { S.q = this.value.toUpperCase().trim(); cBtn.style.display = S.q?'inline':'none'; filter(); });
cBtn.addEventListener('click', function() { sEl.value=''; S.q=''; cBtn.style.display='none'; filter(); });

/* Sort */
document.querySelectorAll('.th-sortable').forEach(function(th) {
  th.addEventListener('click', function() {
    var col = th.dataset.col;
    S.sortCol===col ? S.sortAsc=!S.sortAsc : (S.sortCol=col, S.sortAsc=false);
    document.querySelectorAll('.th-sortable').forEach(function(e){ e.classList.remove('active'); e.querySelector('.sort-arrow').textContent='↓'; });
    th.classList.add('active'); th.querySelector('.sort-arrow').textContent = S.sortAsc?'↑':'↓';
    document.getElementById('sortLabel').textContent = 'Sort: ' + (S.sortCol==='rsm'?'RSM':'Clean Money') + (S.sortAsc?' ↑':' ↓');
    filter();
  });
});

function filter() {
  var rows = S.rows.slice();
  if (S.q) rows = rows.filter(function(r){ return r.ticker.startsWith(S.q); });
  if (S.setup) rows = rows.filter(function(r){ return r.setup === S.setup; });
  var col = S.sortCol === 'rsm' ? 'rsm' : 'cm';
  rows.sort(function(a,b){
    var av=a[col]!=null?a[col]:-999999, bv=b[col]!=null?b[col]:-999999;
    return S.sortAsc ? av-bv : bv-av;
  });
  S.filtered = rows;
  render();
}

function render() {
  var body = document.getElementById('tableBody');
  var rows = S.filtered;
  document.getElementById('resultCount').textContent = rows.length + ' emiten';
  if (!rows.length) {
    body.innerHTML = '<div style="padding:48px 0;text-align:center;color:var(--muted);font-size:13px">Tidak ada data untuk filter ini.</div>';
    document.getElementById('rowCount').textContent = '0 emiten';
    return;
  }
  var maxCM = rows.reduce(function(m,r){ return Math.max(m, Math.abs(r.cm||0)); }, 1);
  body.innerHTML = rows.map(function(r,i){
    var tpsl = window.bsjpTPSL(r.price, r.rsm);
    var tp = tpsl.tp, sl = tpsl.sl;
    var tpDelta = tp && r.price ? (((tp-r.price)/r.price)*100).toFixed(1) : null;
    var slDelta = sl && r.price ? (((sl-r.price)/r.price)*100).toFixed(1) : null;
    return '<div class="data-table-row bsjp-cols">' +
      '<div style="font-family:var(--font-mono);font-size:11.5px;font-weight:600;color:'+(i<3?'var(--accent)':'var(--muted)')+'">'+String(i+1).padStart(2,'0')+'</div>'+
      '<div class="ticker-cell">'+window.tickerAvHTML(r.ticker)+'<div class="ticker-cell-info"><div class="ticker-cell-name">'+r.ticker+'</div><div class="ticker-cell-sub">'+(r.name||'')+'</div></div></div>'+
      '<div>'+window.cmBarHTML(r.cm, maxCM)+'</div>'+
      '<div style="text-align:right;font-family:var(--font-mono);font-size:13px;color:'+(r.rsm>60?'var(--up)':'var(--text-dim)')+'">'+( r.rsm!=null?r.rsm.toFixed(1)+'%':'—')+'</div>'+
      '<div style="text-align:right"><div style="font-family:var(--font-mono);font-size:12.5px;color:var(--up);font-weight:500">'+(tp?window.fmtPrice(tp):'—')+'</div>'+(tpDelta?'<div style="font-family:var(--font-mono);font-size:10px;color:var(--muted)">+'+tpDelta+'%</div>':'')+'</div>'+
      '<div style="text-align:right"><div style="font-family:var(--font-mono);font-size:12.5px;color:var(--down);font-weight:500">'+(sl?window.fmtPrice(sl):'—')+'</div>'+(slDelta?'<div style="font-family:var(--font-mono);font-size:10px;color:var(--muted)">'+slDelta+'%</div>':'')+'</div>'+
      '<div class="price-cell"><div class="price-cell-price">'+(r.price?window.fmtPrice(r.price):'—')+'</div><div class="price-cell-chg '+(r.gain_pct>=0?'up':'down')+'">'+(r.gain_pct!=null?window.fmtPct(r.gain_pct):'—')+'</div></div>'+
      '<div style="display:flex;justify-content:center">'+window.setupBadgeHTML(r.setup)+'</div>'+
    '</div>';
  }).join('');
  document.getElementById('rowCount').textContent = rows.length + ' dari ' + S.rows.length + ' emiten';
}

function load() {
  document.getElementById('tableBody').innerHTML = '<div style="padding:48px 0;text-align:center;color:var(--muted);font-size:13px">Loading...</div>';
  var dmy = window.isoToDD_MM_YYYY(S.date);
  fetch('/api/bsjp/signals?date=' + encodeURIComponent(dmy))
    .then(function(r){ return r.json(); })
    .then(function(d) {
      var signals = d.signals || [];
      S.rows = signals.map(function(r) {
        return {
          ticker:   r.ticker,
          name:     r.name || '',
          cm:       r.clean_money || r.cm_val || 0,
          rsm:      r.rsm || 0,
          price:    r.price_close || r.price || null,
          gain_pct: r.price_change_pct || r.gain_pct || null,
          setup:    r.setup || window.bsjpSetup(r.ticker),
        };
      });

      document.getElementById('statCount').textContent = signals.length;
      document.getElementById('statDate').textContent  = dmy;

      /* Fetch totals from flow API for stat cards */
      fetch('/api/flow?date_from=' + encodeURIComponent(dmy) + '&date_to=' + encodeURIComponent(dmy))
        .then(function(r){ return r.json(); })
        .then(function(fd) {
          var t = fd.totals || {};
          document.getElementById('statSM').textContent = '+' + window.fmtMoney(t.sm || 0);
          document.getElementById('statSMSub').textContent = (fd.tickers||[]).filter(function(r){return(r.sm_val||0)>0;}).length + ' emiten';
          document.getElementById('statBM').textContent = window.fmtMoney(t.bm || 0);
          document.getElementById('statBMSub').textContent = (fd.tickers||[]).filter(function(r){return(r.bm_val||0)>0;}).length + ' emiten';
          var cmT = t.net_cm || 0;
          var cmEl = document.getElementById('statCM');
          cmEl.textContent = (cmT>=0?'+':'') + window.fmtMoney(cmT);
          cmEl.className = 'stat-card-value ' + (cmT>=0?'up':'down');
        }).catch(function(){});

      filter();
    })
    .catch(function() {
      document.getElementById('tableBody').innerHTML = '<div style="padding:48px 0;text-align:center;color:var(--muted);font-size:13px">Gagal memuat data.</div>';
    });
}

load();
})();
</script>
</body>
</html>
