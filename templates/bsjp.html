<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zenith — BSJP Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/tokens.css">
<style>
:root {
  --bg:       #080c10;
  --surface:  #0e1318;
  --surface2: #121920;
  --border:   #1a2230;
  --border2:  #243040;
  --accent:   #00e8a2;
  --accent2:  #4d9fff;
  --danger:   #ff4d6a;
  --text:     #c8d8e8;
  --muted:    #bfcbd4;
  --up:       #00e8a2;
  --down:     #ff4d6a;
}
* { box-sizing: border-box; margin: 0; padding: 0; scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }
html { scrollbar-gutter: stable; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  min-height: 100vh;
  display: flex; flex-direction: column;
}

/* ── HEADER ─────────────────────────────────────── */
header {
  position: sticky; top: 0; z-index: 200;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 24px;
  border-bottom: 1px solid var(--border);
  background: rgba(8,12,16,.88);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
header::before {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,232,162,.3), transparent);
}
.logo {
  display: flex; align-items: center;
  font-family: 'Space Mono', monospace;
  font-size: 12px; font-weight: 700;
  letter-spacing: .18em; color: var(--accent);
  text-transform: uppercase; white-space: nowrap;
  text-decoration: none;
}
.logo-dot {
  display: inline-block; width: 7px; height: 7px;
  border-radius: 50%; background: var(--accent);
  margin-right: 8px; flex-shrink: 0;
  animation: dotPulse 2.4s ease-in-out infinite;
}
@keyframes dotPulse{0%,100%{box-shadow:0 0 6px var(--accent),0 0 0 0 rgba(0,232,162,.5)}50%{box-shadow:0 0 14px var(--accent),0 0 0 5px rgba(0,232,162,0)}}
.nav-group {
  display: flex; align-items: center;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 3px; gap: 2px;
}
.nav-btn {
  background: none; border: 1px solid transparent;
  color: var(--muted); border-radius: 4px;
  padding: 4px 12px; cursor: pointer;
  font-family: 'Space Mono', monospace;
  font-size: 11px; letter-spacing: .06em;
  text-decoration: none; transition: all .15s;
}
.nav-btn:hover { color: var(--accent); }
.nav-btn.active { background: var(--surface); border-color: rgba(0,232,162,.25); color: var(--accent); }
.ihsg-wrap {
  margin-left: auto; display: flex; align-items: center; gap: 8px;
  font-family: 'Space Mono', monospace;
}
.ihsg-label { font-size:10px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.ihsg-price { font-size: 13px; font-weight: 700; color: var(--text); }
.ihsg-gain  { font-size: 11px; font-weight: 700; }
.info-btn {
  display: flex; align-items: center; justify-content: center;
  width: 28px; height: 28px;
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 6px; color: var(--muted);
  font-family: 'Space Mono', monospace; font-size: 12px;
  cursor: pointer; transition: all .15s; text-decoration: none;
  flex-shrink: 0;
}
.info-btn:hover { border-color: var(--accent); color: var(--accent); }
.info-btn svg { width: 12px; height: 12px; }

/* ── STATS BAR ───────────────────────────────────── */
.stats-bar {
  display: flex; align-items: stretch;
  background: var(--surface);
  border-bottom: 1px solid var(--border2);
  overflow-x: auto; flex-shrink: 0;
}
.stat-item {
  display: flex; flex-direction: column;
  justify-content: center; gap: 3px;
  padding: 10px 18px;
  border-right: 1px solid var(--border);
  white-space: nowrap;
  flex: 1; min-width: 80px;
}
.stat-item.highlight { background: rgba(0,232,162,.025); }
.stat-item .s-label {
  font-family: 'Space Mono', monospace;
  font-size:10px; letter-spacing: .1em;
  color: var(--muted); text-transform: uppercase;
}
.stat-item .s-val {
  font-family: 'Space Mono', monospace;
  font-size: 12px; font-weight: 700;
  color: var(--text);
}
.stat-item .s-val.up      { color: var(--up); }
.stat-item .s-val.down    { color: var(--down); }
.stat-item .s-val.neutral { color: var(--accent2); }
.stat-item .s-val.muted   { color: var(--muted); }

/* ── MARKET WARNING ──────────────────────────────── */
.market-warn {
  display: none; align-items: center; gap: 12px;
  background: rgba(255,77,106,.07);
  border-bottom: 1px solid rgba(255,77,106,.28);
  padding: 10px 24px; flex-shrink: 0;
}
.market-warn.visible { display: flex; }
.warn-icon { font-size: 16px; flex-shrink: 0; }
.warn-text { font-size: 12px; color: var(--danger); }
.warn-text strong {
  font-family: 'Space Mono', monospace;
  font-size: 11px; margin-right: 6px;
}

/* ── TOOLBAR ─────────────────────────────────────── */
.toolbar {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--surface2); flex-shrink: 0;
}
.date-input {
  background: var(--bg); border: 1px solid var(--border2);
  color: var(--text); border-radius: 6px;
  padding: 8px 12px; font-family: 'Space Mono', monospace;
  font-size: 11px; outline: none; width: 130px;
  letter-spacing: .04em; transition: border-color .15s;
}
.date-input:focus { border-color: rgba(0,232,162,.35); }

/* Status filter buttons */
.status-filter-group {
  display: flex; align-items: center;
  background: var(--bg); border: 1px solid var(--border2);
  border-radius: 6px; padding: 3px; gap: 2px;
}
.status-filter-btn {
  background: none; border: 1px solid transparent;
  color: var(--muted); border-radius: 4px;
  padding: 4px 10px; cursor: pointer;
  font-family: 'Space Mono', monospace;
  font-size: 10px; letter-spacing: .06em;
  transition: all .15s; text-transform: uppercase;
}
.status-filter-btn:hover { color: var(--text); }
.status-filter-btn.active { background: var(--surface); border-color: var(--border2); color: var(--text); }
.status-filter-btn.confirmed.active { border-color: rgba(0,232,162,.35); color: var(--accent); background: rgba(0,232,162,.06); }
.status-filter-btn.estimasi.active  { border-color: rgba(77,159,255,.35); color: var(--accent2); background: rgba(77,159,255,.06); }
.status-filter-btn.invalid.active   { border-color: rgba(255,77,106,.35); color: var(--danger); background: rgba(255,77,106,.06); }

/* Ticker search */
.ticker-search-wrap {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 12px;
  margin-left: auto; transition: border-color .2s;
}
.ticker-search-wrap:focus-within { border-color: var(--border2); }
.ticker-search-wrap input {
  background: none; border: none; outline: none;
  color: var(--text); font-family: 'DM Sans', sans-serif;
  font-size: 12px; width: 140px;
}
.ticker-search-wrap input::placeholder { color: var(--muted); }

.row-count {
  font-family: 'Space Mono', monospace;
  font-size: 10px; color: var(--muted);
  letter-spacing: .06em; white-space: nowrap;
}

/* ── MAIN ────────────────────────────────────────── */
body.sidebar-layout main#main {
  flex: 1; display: flex; flex-direction: column; min-height: 0;
}
body.sidebar-layout .stats-bar,
body.sidebar-layout .toolbar { flex-shrink: 0; }

/* ── TABLE ───────────────────────────────────────── */
.table-wrap {
  flex: 1; min-height: 0; overflow: auto;
  padding: 0 24px 24px;
}
table {
  width: 100%; border-collapse: separate; border-spacing: 0;
  margin-top: 12px;
}
thead th {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg);
  box-shadow: 0 2px 0 var(--border2);
  padding: 13px 10px;
  font-family: 'Space Mono', monospace;
  font-size: 11px; font-weight: 700;
  letter-spacing: .12em; color: var(--muted);
  text-align: right; text-transform: uppercase;
  white-space: nowrap; cursor: pointer; user-select: none;
  transition: color .15s;
}
thead th:first-child,
thead th.left { text-align: left; }
thead th:hover { color: var(--text); }
thead th.sorted { color: var(--accent); }
thead th .sort-icon { margin-left: 4px; font-size:10px; }

tbody tr {
  border-bottom: 1px solid rgba(255,255,255,.04);
  border-left: 2px solid var(--border2);
  transition: background .1s;
  animation: rowIn .3s ease both;
}
tbody tr.status-confirmed { border-left-color: var(--up); }
tbody tr.status-estimasi  { border-left-color: var(--accent2); }
tbody tr.status-invalid   { border-left-color: var(--danger); opacity: .65; }
tbody tr:hover { background: rgba(0,232,162,.025); }
@keyframes rowIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}

td {
  padding: 11px 8px;
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
td:first-child,
td.left { text-align: left; }

.td-rank {
  font-family: 'Space Mono', monospace;
  font-size: 11px; color: var(--muted);
  font-weight: 700; width: 36px;
}
.td-ticker {
  font-family: 'Space Mono', monospace;
  font-size: 12px; font-weight: 700;
  color: var(--text); letter-spacing: .04em;
}
.td-setup {
  font-family: 'Space Mono', monospace;
  font-size: 10px; color: var(--muted);
  letter-spacing: .03em; max-width: 160px;
}
.td-price {
  font-family: 'Space Mono', monospace;
  font-size: 12px;
}
.td-price.tp  { color: var(--up); }
.td-price.sl  { color: var(--down); }
.td-price.est { color: var(--text); }
.td-score {
  font-family: 'Space Mono', monospace;
  font-size: 11px; color: var(--accent2); font-weight: 700;
}
.td-lot {
  font-family: 'Space Mono', monospace;
  font-size: 11px; color: var(--muted);
}
.td-keterangan {
  font-family: 'DM Sans', sans-serif;
  font-size: 11px; color: var(--danger);
  max-width: 180px; white-space: normal;
}

/* Status badges */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: 'Space Mono', monospace;
  font-size: 10px; font-weight: 700;
  letter-spacing: .06em; padding: 2px 8px;
  border-radius: 99px; text-transform: uppercase;
}
.badge.confirmed { background: rgba(0,232,162,.10); border: 1px solid rgba(0,232,162,.28); color: var(--accent); }
.badge.estimasi  { background: rgba(77,159,255,.12); border: 1px solid rgba(77,159,255,.3); color: var(--accent2); }
.badge.invalid   { background: rgba(255,77,106,.09); border: 1px solid rgba(255,77,106,.25); color: var(--danger); }

/* ── MODAL ───────────────────────────────────────── */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,.82);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
.modal-backdrop.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 12px;
  width: 100%; max-width: 560px;
  transform: scale(.97); transition: transform .2s;
  overflow: hidden;
}
.modal-backdrop.open .modal { transform: scale(1); }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--border);
}
.modal-ticker-name {
  font-family: 'Space Mono', monospace;
  font-size: 18px; font-weight: 700; color: var(--text);
  letter-spacing: .08em;
}
.modal-setup-name {
  font-family: 'Space Mono', monospace;
  font-size: 10px; color: var(--muted);
  letter-spacing: .06em; margin-top: 3px;
}
.close-btn {
  background: none; border: none; color: var(--muted);
  font-size: 18px; cursor: pointer; padding: 2px 6px;
  transition: color .15s;
}
.close-btn:hover { color: var(--text); }
.modal-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.modal-metrics {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
}
.mm-item { display: flex; flex-direction: column; gap: 2px; }
.mm-label {
  font-family: 'Space Mono', monospace; font-size: 9px;
  letter-spacing: .1em; color: var(--muted); text-transform: uppercase;
}
.mm-value {
  font-family: 'Space Mono', monospace; font-size: 13px;
  font-weight: 700; color: var(--text);
}
.mm-value.up  { color: var(--up); }
.mm-value.dn  { color: var(--down); }
.mm-value.bl  { color: var(--accent2); }
.mm-sub { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--muted); }
.modal-divider { height: 1px; background: var(--border); }
.modal-score-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 16px;
}
.score-big {
  font-family: 'Space Mono', monospace; font-size: 28px;
  font-weight: 700; color: var(--accent2); flex-shrink: 0; width: 90px;
}
.score-breakdown {
  display: flex; flex-direction: column; gap: 4px; flex: 1;
}
.sb-item {
  display: flex; justify-content: space-between;
  font-family: 'Space Mono', monospace; font-size: 10px;
}
.sb-key { color: var(--muted); }
.sb-val { color: var(--text); font-weight: 700; }
.modal-keterangan {
  font-size: 12px; color: var(--danger);
  background: rgba(255,77,106,.06); border: 1px solid rgba(255,77,106,.2);
  border-radius: 6px; padding: 10px 14px;
}

/* Loading / empty */
.state-row td {
  text-align: center; padding: 60px;
  color: var(--muted); font-size: 13px;
}
.spinner-inline {
  display: inline-block; width: 16px; height: 16px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .7s linear infinite;
  vertical-align: middle; margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── RESPONSIVE ──────────────────────────────────── */
@media (max-width: 768px) {
  header { padding: 10px 14px; gap: 10px; }
  .stats-bar { display: grid; grid-template-columns: repeat(3,1fr); }
  .stat-item { padding: 8px 10px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .toolbar { flex-wrap: wrap; gap: 6px; padding: 8px 12px; }
  .date-input { width: 108px; font-size: 10px; padding: 5px 6px; }
  .table-wrap { padding: 0 12px 16px; }
}
</style>

<script>
const WIB_OFFSET = 7 * 60;

let allSignals = [];
let sortCol    = 'day_rank';
let sortAsc    = true;

/* ── Date helpers ── */
function todayDMY() {
  const now = new Date(Date.now() + (WIB_OFFSET - new Date().getTimezoneOffset()) * 60000);
  return `${String(now.getUTCDate()).padStart(2,'0')}-${String(now.getUTCMonth()+1).padStart(2,'0')}-${now.getUTCFullYear()}`;
}
function dateToDMY(val) {
  if (!val) return todayDMY();
  const [y,m,d] = val.split('-');
  return `${d}-${m}-${y}`;
}
function dmyToInputVal(dmy) {
  if (!dmy) return '';
  const [d,m,y] = dmy.split('-');
  return `${y}-${m}-${d}`;
}

/* ── Formatters ── */
function fmtPrice(v) {
  if (v == null) return '—';
  return Number(v).toLocaleString('id-ID');
}
function fmtScore(v) {
  if (v == null) return '—';
  return Number(v).toFixed(4);
}
function fmtLot(v) {
  if (v == null) return '—';
  return Number(v).toLocaleString('id-ID');
}
function fmtCapital(n) {
  const total = n * 10_000_000;
  if (total >= 1_000_000_000) return (total/1_000_000_000).toFixed(0) + 'M';
  return (total/1_000_000).toFixed(0) + 'jt';
}

/* ── Entry display ── */
function entryVal(s) {
  return s.entry;
}

/* ── Sort ── */
function sortBy(col) {
  if (sortCol === col) { sortAsc = !sortAsc; }
  else { sortCol = col; sortAsc = (col === 'day_rank' || col === 'ticker' || col === 'setup'); }
  updateSortIcons();
  renderTable();
}
function updateSortIcons() {
  document.querySelectorAll('thead th[data-col]').forEach(th => {
    const icon = th.querySelector('.sort-icon');
    if (!icon) return;
    if (th.dataset.col === sortCol) {
      icon.textContent = sortAsc ? '▲' : '▼';
      th.classList.add('sorted');
    } else {
      icon.textContent = '';
      th.classList.remove('sorted');
    }
  });
}

/* ── Render table ── */
function renderTable() {
  const tickerQ = (document.getElementById('tickerFilter').value || '').toUpperCase().trim();
  const tbody   = document.getElementById('bsjpBody');

  let rows = allSignals.filter(s => {
    if (tickerQ && !s.ticker.includes(tickerQ)) return false;
    return true;
  });

  rows.sort((a, b) => {
    let va, vb;
    if (sortCol === 'entry')  { va = entryVal(a) ?? 0; vb = entryVal(b) ?? 0; }
    else                      { va = a[sortCol] ?? 0;   vb = b[sortCol] ?? 0; }
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ?  1 : -1;
    return 0;
  });

  document.getElementById('rowCount').textContent = rows.length ? `${rows.length} sinyal` : '';

  if (rows.length === 0) {
    tbody.innerHTML = '<tr class="state-row"><td colspan="5">Tidak ada sinyal untuk filter ini</td></tr>';
    return;
  }

  tbody.innerHTML = '';
  rows.forEach(s => {
    const tr = document.createElement('tr');
    tr.style.cursor = 'pointer';
    const ev = entryVal(s);
    tr.innerHTML = `
      <td class="td-rank left">${s.day_rank ?? '—'}</td>
      <td class="td-ticker left">${s.ticker}</td>
      <td class="td-setup left">${s.setup ?? '—'}</td>
      <td class="td-price est">${ev != null ? fmtPrice(ev) : '—'}</td>
      <td class="td-score">${fmtScore(s.score)}</td>
    `;
    tr.addEventListener('click', () => openModal(s));
    tbody.appendChild(tr);
  });
}

/* ── Modal ── */
function pct(entry, target) {
  if (!entry || !target) return '';
  return ' <span style="font-size:9px;color:var(--muted)">(' + (((target - entry) / entry) * 100).toFixed(1) + '%)</span>';
}

function mm(label, value, cls) {
  return `<div class="mm-item"><div class="mm-label">${label}</div><div class="mm-value ${cls||''}">${value}</div></div>`;
}

function openModal(s) {
  const entry = entryVal(s);
  document.getElementById('mTicker').textContent = s.ticker;
  document.getElementById('mSetup').textContent  = s.setup ?? '—';

  const badge = document.getElementById('mBadge');
  badge.className   = 'badge estimasi';
  badge.textContent = 'PENDING';

  // Score + breakdown
  document.getElementById('mScore').textContent = fmtScore(s.score);
  document.getElementById('mBreakdown').innerHTML = `
    <div class="sb-item"><span class="sb-key">RSM × 0.30</span><span class="sb-val">—</span></div>
    <div class="sb-item"><span class="sb-key">SRI × 0.25</span><span class="sb-val">—</span></div>
    <div class="sb-item"><span class="sb-key">Setup WR × 0.25</span><span class="sb-val">—</span></div>
    <div class="sb-item"><span class="sb-key">MF Ratio × 0.10</span><span class="sb-val">—</span></div>
    <div class="sb-item"><span class="sb-key">Close Pos × 0.10</span><span class="sb-val">—</span></div>
  `;

  // Entry / TP / SL
  document.getElementById('mMetrics').innerHTML =
    mm('ENTRY', entry != null ? fmtPrice(entry) : '—', '') +
    mm('TP1', fmtPrice(s.tp1) + pct(entry, s.tp1), 'up') +
    mm('TP2', fmtPrice(s.tp2) + pct(entry, s.tp2), 'up') +
    mm('SL',  fmtPrice(s.sl)  + pct(entry, s.sl),  'dn') +
    mm('LOT',  fmtLot(s.lot_size), 'bl') +
    mm('MODAL', s.lot_size && entry ? 'Rp ' + (s.lot_size * entry).toLocaleString('id-ID', {maximumFractionDigits:0}) : '—', '');

  // Lot / Capital (secondary row hidden — merged above)
  document.getElementById('mLot').innerHTML = '';

  // Keterangan hidden — no invalid_reason in new schema
  document.getElementById('mKet').style.display = 'none';

  document.getElementById('modalBackdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('open');
  document.body.style.overflow = '';
}

function handleBackdropClick(e) {
  if (e.target === document.getElementById('modalBackdrop')) closeModal();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

/* ── Load signals ── */
async function loadSignals() {
  const dmy = dateToDMY(document.getElementById('datePicker').value);

  document.getElementById('sDate').textContent = dmy;
  document.getElementById('bsjpBody').innerHTML =
    '<tr class="state-row"><td colspan="5"><span class="spinner-inline"></span>Memuat sinyal…</td></tr>';
  document.getElementById('marketWarn').classList.remove('visible');

  let data;
  try {
    const res = await fetch(`/api/bsjp/signals?date=${dmy}&status=ALL`);
    data = await res.json();
  } catch(e) {
    document.getElementById('bsjpBody').innerHTML =
      '<tr class="state-row"><td colspan="5" style="color:var(--danger)">Gagal memuat data — coba refresh</td></tr>';
    return;
  }

  allSignals = data.signals || [];

  const pending = allSignals.filter(s => s.status === 'PENDING').length;
  const total   = allSignals.length;

  document.getElementById('sTotal').textContent   = total   || '—';
  document.getElementById('sPending').textContent = pending || '—';
  document.getElementById('sCapital').textContent = total > 0 ? fmtCapital(total) : '—';

  renderTable();
  checkMarketWarning(dmy);
}

/* ── Market warning ── */
async function checkMarketWarning(dmy) {
  try {
    const res  = await fetch(`/api/flow?date_from=${dmy}&date_to=${dmy}`);
    const data = await res.json();
    const ihsg = (data.tickers || []).find(t => t.ticker === 'COMPOSITE' || t.ticker === 'IHSG');
    if (ihsg && ihsg.gain_pct != null && ihsg.gain_pct < -1.5) {
      document.getElementById('marketWarn').classList.add('visible');
    }
  } catch (_) {}
}

/* ── IHSG strip ── */
async function loadIHSG() {
  try {
    const res  = await fetch('/api/ihsg');
    const data = await res.json();
    if (data.price) {
      document.getElementById('sIHSG').textContent = Number(data.price).toLocaleString('id-ID', {maximumFractionDigits:2});
    }
    if (data.gain_pct != null) {
      const el = document.getElementById('sIHSGGain');
      el.style.display = '';
      const sign = data.gain_pct >= 0 ? '+' : '';
      el.textContent = `${sign}${data.gain_pct.toFixed(2)}%`;
      el.style.color = data.gain_pct >= 0 ? 'var(--up)' : 'var(--down)';
    }
  } catch (_) {}
}

/* ── Init ── */
(function init() {
  document.getElementById('datePicker').value = dmyToInputVal(todayDMY());
  document.getElementById('datePicker').addEventListener('change', loadSignals);
  updateSortIcons();
  loadSignals();
  loadIHSG();
})();
</script>
</body>
</html>
