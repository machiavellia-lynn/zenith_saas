<aside class="sidebar" id="sidebar">

  <!-- Brand / Logo — stacked: icon atas, ZENITH bawah -->
  <div class="sidebar-brand">
    <a href="/hub">
      <svg class="sidebar-logo-icon" viewBox="-105 -45 165 65" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M-90 10 L-35 -25 L10 -8 L55 -35" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="-90" cy="10"  r="7" fill="none" stroke="#ffffff" stroke-width="3"/>
        <circle cx="-35" cy="-25" r="7" fill="none" stroke="#ffffff" stroke-width="3"/>
        <circle cx="10"  cy="-8"  r="7" fill="none" stroke="#ffffff" stroke-width="3"/>
        <circle cx="55"  cy="-35" r="7" fill="none" stroke="#ffffff" stroke-width="3"/>
      </svg>
      <span class="sidebar-logo-name">ZENITH</span>
    </a>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">

    <a href="/hub" class="s-item{% if request.path == '/hub' %} active{% endif %}">
      <svg class="s-svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 6.5L8 1.5L14.5 6.5V14H10V9.5H6V14H1.5V6.5Z"/></svg>
      <span>Hub</span>
    </a>

    <a href="/chart" class="s-item{% if request.path == '/chart' %} active{% endif %}">
      <svg class="s-svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 12L5.5 7.5L9 10.5L13.5 4"/><circle cx="2" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="5.5" cy="7.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="9" cy="10.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="13.5" cy="4" r="1.3" fill="currentColor" stroke="none"/></svg>
      <span>Charts</span>
    </a>

    <div class="s-divider"></div>

    <!-- Algo (collapsible) -->
    <div class="s-group{% if request.path in ['/flow'] %} open{% endif %}" id="group-algo">
      <button class="s-group-toggle" onclick="sidebarToggleGroup('group-algo')">
        <svg class="s-svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 2.5L8 13.5L13 2.5"/><line x1="5" y1="8" x2="11" y2="8"/></svg>
        <span>Algo</span>
        <svg class="s-chevron-svg" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1 1L5 5L9 1"/></svg>
      </button>
      <div class="s-group-items">
        <div class="s-group-items-inner">
          <a href="/flow" class="s-item s-sub{% if request.path == '/flow' %} active{% endif %}">
            <svg class="s-svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 10C2.5 10 2.5 6 4 6S5.5 10 7 10S8.5 6 10 6S11.5 10 13 10S14.5 7 15 6"/></svg>
            <span>Wyckoff</span>
          </a>
          <div class="s-coming-soon">More coming soon</div>
        </div>
      </div>
    </div>

    <div class="s-divider"></div>

    <!-- Analysis (collapsible) -->
    <div class="s-group{% if request.path in ['/sector', '/backtest'] %} open{% endif %}" id="group-analysis">
      <button class="s-group-toggle" onclick="sidebarToggleGroup('group-analysis')">
        <svg class="s-svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg>
        <span>Analysis</span>
        <svg class="s-chevron-svg" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1 1L5 5L9 1"/></svg>
      </button>
      <div class="s-group-items">
        <div class="s-group-items-inner">
          <a href="/sector" class="s-item s-sub{% if request.path == '/sector' %} active{% endif %}">
            <svg class="s-svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
            <span>Sector</span>
          </a>
          <a href="/backtest" class="s-item s-sub{% if request.path == '/backtest' %} active{% endif %}">
            <svg class="s-svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 4.5V9.5H6.5"/><path d="M2 9.5A6.5 6.5 0 1 0 3.5 3.5"/></svg>
            <span>Backtest</span>
          </a>
        </div>
      </div>
    </div>

  </nav>
</aside>

<!-- Mobile overlay -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="sidebarClose()"></div>

<script>
(function() {
  function sidebarToggleGroup(id) {
    var el = document.getElementById(id);
    if (el) el.classList.toggle('open');
  }
  function sidebarOpen() {
    document.getElementById('sidebar').classList.add('open');
    var ov = document.getElementById('sidebarOverlay');
    if (ov) { ov.style.display = 'block'; requestAnimationFrame(function(){ ov.classList.add('visible'); }); }
    document.body.style.overflow = 'hidden';
  }
  function sidebarClose() {
    document.getElementById('sidebar').classList.remove('open');
    var ov = document.getElementById('sidebarOverlay');
    if (ov) {
      ov.classList.remove('visible');
      setTimeout(function(){ ov.style.display = 'none'; }, 280);
    }
    document.body.style.overflow = '';
  }
  window.sidebarToggleGroup = sidebarToggleGroup;
  window.sidebarOpen = sidebarOpen;
  window.sidebarClose = sidebarClose;
})();
</script>
