<aside class="sidebar" id="sidebar">

  <!-- Brand -->
  <div class="sidebar-brand">
    <a href="/hub" class="sidebar-brand-link">
      <!-- Mini icon: always visible when collapsed, fades out on expand -->
      <svg class="sidebar-logo-mini" viewBox="28 6 148 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M43 53 L83 29 M94 28 L119 38 M130 37 L161 18"
              stroke="white" stroke-width="2.8" stroke-linecap="round"/>
        <circle cx="38"  cy="56" r="6" fill="none" stroke="white" stroke-width="2.8"/>
        <circle cx="88"  cy="26" r="6" fill="none" stroke="white" stroke-width="2.8"/>
        <circle cx="125" cy="40" r="6" fill="none" stroke="white" stroke-width="2.8"/>
        <circle cx="166" cy="15" r="6" fill="none" stroke="white" stroke-width="2.8"/>
      </svg>
      <!-- Full logo: absolute centered, fades in on expand -->
      <svg class="sidebar-logo-svg" viewBox="0 0 210 82" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M43 53 L83 29 M94 28 L119 38 M130 37 L161 18"
              stroke="white" stroke-width="2.8" stroke-linecap="round"/>
        <circle cx="38"  cy="56" r="6" fill="none" stroke="white" stroke-width="2.8"/>
        <circle cx="88"  cy="26" r="6" fill="none" stroke="white" stroke-width="2.8"/>
        <circle cx="125" cy="40" r="6" fill="none" stroke="white" stroke-width="2.8"/>
        <circle cx="166" cy="15" r="6" fill="none" stroke="white" stroke-width="2.8"/>
        <text x="105" y="78"
              text-anchor="middle" fill="white"
              font-family="'Space Mono','IBM Plex Mono',monospace"
              font-weight="700" font-size="20" letter-spacing="8">ZENITH</text>
      </svg>
    </a>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">

    <a href="/hub" class="s-item{% if request.path == '/hub' %} active{% endif %}">
      <svg class="s-svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 6.5L8 1.5L14.5 6.5V14H10V9.5H6V14H1.5V6.5Z"/></svg>
      <span class="s-text">Hub</span>
    </a>

    <div class="s-divider"></div>

    <a href="/chart" class="s-item{% if request.path == '/chart' %} active{% endif %}">
      <svg class="s-svg" viewBox="0 0 16 16" fill="currentColor" stroke="none"><rect x="1.5" y="8" width="3.5" height="6.5" rx="0.8"/><rect x="6.5" y="4.5" width="3.5" height="10" rx="0.8"/><rect x="11.5" y="1.5" width="3.5" height="13" rx="0.8"/></svg>
      <span class="s-text">Charts</span>
    </a>

    <div class="s-divider"></div>

    <a href="/flow" class="s-item{% if request.path == '/flow' %} active{% endif %}">
      <svg class="s-svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="4" cy="8" r="2"/><circle cx="12" cy="8" r="2"/><line x1="6" y1="8" x2="10" y2="8"/></svg>
      <span class="s-text">Flow</span>
    </a>

    <div class="s-divider"></div>

    <!-- Algo (collapsible) -->
    <div class="s-group{% if request.path in ['/wyckoff', '/bsjp'] %} open{% endif %}" id="group-algo">
      <button class="s-group-toggle" onclick="sidebarToggleGroup('group-algo')">
        <svg class="s-svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 2.5L8 13.5L13 2.5"/><line x1="5.2" y1="8" x2="10.8" y2="8"/></svg>
        <span class="s-text">Algo</span>
        <svg class="s-chevron-svg" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1 1L5 5L9 1"/></svg>
      </button>
      <div class="s-group-items">
        <div class="s-group-items-inner">
          <a href="/wyckoff" class="s-item s-sub{% if request.path == '/wyckoff' %} active{% endif %}">
            <svg class="s-svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 10C2.5 10 2.5 6 4 6S5.5 10 7 10S8.5 6 10 6S11.5 10 13 10S14.5 7 15 6"/></svg>
            <span class="s-text">Wyckoff</span>
          </a>
          <div class="s-divider-sub"></div>
          <a href="/bsjp" class="s-item s-sub{% if request.path == '/bsjp' %} active{% endif %}">
            <svg class="s-svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="5.5"/><path d="M8 5.5V8l2 2"/></svg>
            <span class="s-text">BSJP</span>
          </a>
        </div>
      </div>
    </div>

    <div class="s-divider"></div>

    <!-- Analysis (collapsible) -->
    <div class="s-group{% if request.path in ['/sector', '/backtest'] %} open{% endif %}" id="group-analysis">
      <button class="s-group-toggle" onclick="sidebarToggleGroup('group-analysis')">
        <svg class="s-svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg>
        <span class="s-text">Analysis</span>
        <svg class="s-chevron-svg" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1 1L5 5L9 1"/></svg>
      </button>
      <div class="s-group-items">
        <div class="s-group-items-inner">
          <a href="/sector" class="s-item s-sub{% if request.path == '/sector' %} active{% endif %}">
            <svg class="s-svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
            <span class="s-text">Sector</span>
          </a>
          <div class="s-divider-sub"></div>
          <a href="/backtest" class="s-item s-sub{% if request.path == '/backtest' %} active{% endif %}">
            <svg class="s-svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 4.5V9.5H6.5"/><path d="M2 9.5A6.5 6.5 0 1 0 3.5 3.5"/></svg>
            <span class="s-text">Backtest</span>
          </a>
        </div>
      </div>
    </div>

  </nav>

</aside>

<!-- Mobile overlay -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="sidebarClose()"></div>

<script>
(function() {
  var sb = document.getElementById('sidebar');
  var collapseTimer = null;

  function sidebarToggleGroup(id) {
    if (!sb.classList.contains('expanded') && window.innerWidth > 768) return;
    var el = document.getElementById(id);
    if (el) el.classList.toggle('open');
  }

  /* ── Auto-collapse hover (desktop only) ── */
  function expandSidebar() {
    if (window.innerWidth <= 768) return;
    clearTimeout(collapseTimer);
    sb.classList.add('expanded');
  }

  function scheduleSidebarCollapse() {
    if (window.innerWidth <= 768) return;
    clearTimeout(collapseTimer);
    sb.classList.remove('expanded');
  }

  sb.addEventListener('mouseenter', expandSidebar);
  sb.addEventListener('mouseleave', scheduleSidebarCollapse);

  /* ── Mobile open/close ── */
  function sidebarOpen() {
    sb.classList.add('open');
    var ov = document.getElementById('sidebarOverlay');
    if (ov) {
      ov.style.display = 'block';
      requestAnimationFrame(function(){ ov.classList.add('visible'); });
    }
    document.body.style.overflow = 'hidden';
  }

  function sidebarClose() {
    sb.classList.remove('open');
    var ov = document.getElementById('sidebarOverlay');
    if (ov) {
      ov.classList.remove('visible');
      setTimeout(function(){ ov.style.display = 'none'; }, 280);
    }
    document.body.style.overflow = '';
  }

  window.sidebarToggleGroup = sidebarToggleGroup;
  window.sidebarOpen = sidebarOpen;
  window.sidebarClose = sidebarClose;
})();
</script>
