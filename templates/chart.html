<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8"/>
<script>(function(){var t=localStorage.getItem('zenith-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zenith — Chart</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/sidebar.css">
<link rel="stylesheet" href="/static/components.css">
<style>
html, body { height: 100%; }
body.sidebar-layout { overflow: hidden; }
.main-content { overflow: hidden; display: flex; flex-direction: column; }
.chart-ticker-input-wrap {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 14px; background: var(--surface);
  border: 1.5px solid var(--accent); border-radius: 9px;
  flex: 0 0 200px; box-shadow: 0 0 0 3px var(--accent-soft);
}
.chart-ticker-input {
  border: none; outline: none; background: transparent;
  font-size: 14px; font-weight: 600; font-family: var(--font-display);
  color: var(--ink); letter-spacing: .04em; text-transform: uppercase; width: 100%;
}
.chart-ticker-input::placeholder { color: var(--muted); text-transform: none; }
.tf-selector {
  display: flex; align-items: center; background: var(--surface2);
  border: 1px solid var(--border2); border-radius: 7px; overflow: hidden;
}
.tf-arrow {
  width: 28px; height: 32px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-dim); font-size: 10px; line-height: 1;
  user-select: none; transition: color .1s;
}
.tf-arrow:hover { color: var(--ink); }
.tf-arrow.disabled { color: var(--border2); cursor: default; }
.tf-arrow.disabled:hover { color: var(--border2); }
.tf-curr {
  padding: 0 12px; font-family: var(--font-mono); font-size: 12px; font-weight: 700;
  color: var(--ink); min-width: 38px; text-align: center; letter-spacing: .05em;
  line-height: 32px; border-left: 1px solid var(--border); border-right: 1px solid var(--border);
}
.ovl-btn {
  display: flex; align-items: center; gap: 5px; padding: 4px 10px;
  border-radius: 6px; cursor: pointer; border: 1px solid var(--border);
  font-size: 11.5px; color: var(--text-dim); background: transparent;
  transition: all .1s; user-select: none;
}
.ovl-dot { width: 8px; height: 8px; border-radius: 99px; flex-shrink: 0; opacity: .35; }
.ovl-btn.active { color: var(--ovl-col, var(--accent)); border-color: var(--ovl-col, var(--accent)); }
.ovl-btn.active .ovl-dot { opacity: 1; }
.scale-toggle { display: flex; gap: 3px; background: var(--surface2); padding: 3px; border-radius: 7px; }
.scale-btn {
  padding: 4px 9px; font-size: 11px; border-radius: 5px; cursor: pointer;
  font-family: var(--font-mono); color: var(--text-dim); background: transparent; transition: all .1s;
}
.scale-btn.active { background: var(--surface); color: var(--ink); }
.chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.chart-toolbar {
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.ohlc-bar {
  display: flex; align-items: center; gap: 18px; padding: 10px 18px;
  border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: 11.5px;
}
.ohlc-sep { color: var(--border2); }
.ohlc-l { color: var(--muted); margin-right: 4px; }
.ohlc-v { color: var(--ink); font-weight: 600; }
#chartArea { background: var(--bg); }
.metrics-strip {
  display: flex; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden; flex-shrink: 0;
}
.metric-cell { flex: 1; padding: 12px 16px; border-right: 1px solid var(--border); }
.metric-cell:last-child { border-right: none; }
.metric-lbl { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
.metric-val { font-family: var(--font-mono); font-size: 15px; font-weight: 700; line-height: 1; color: var(--ink); }
.trx-tables { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.trx-table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.trx-head { padding: 9px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 7px; background: var(--surface2); }
.trx-dot { width: 7px; height: 7px; border-radius: 99px; flex-shrink: 0; }
.trx-title { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.trx-cnt { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }
.trx-scroll { overflow-y: auto; max-height: 200px; }
.trx-table { width: 100%; border-collapse: collapse; }
.trx-th { padding: 5px 12px; text-align: right; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; color: var(--muted); border-bottom: 1px solid var(--border); font-weight: 600; background: var(--surface2); }
.trx-th:first-child { text-align: left; }
.trx-td { padding: 7px 12px; text-align: right; font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
.trx-td:first-child { text-align: left; }
.trx-row + .trx-row td { border-top: 1px solid var(--border); }

/* Loading state */
.chart-loading {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: var(--surface); z-index: 10; opacity: 0; pointer-events: none; transition: opacity .2s;
}
.chart-loading.visible { opacity: 1; pointer-events: all; }
.spinner-sm {
  width: 24px; height: 24px; border: 2px solid var(--border2);
  border-top-color: var(--accent); border-radius: 99px;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes adminSpin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="sidebar-layout">
{% include 'sidebar.html' %}

<div class="main-content">
  <div class="page-header">
    <div>
      <div class="page-subtitle">Candlestick · OHLCV · Volume</div>
      <h1 class="page-title">Chart</h1>
    </div>
    <div class="page-header-actions">
      <div class="ihsg-pill">
        <span class="ihsg-pill-label">IHSG</span>
        <span class="ihsg-pill-price" id="ihsgPrice">—</span>
        <span class="ihsg-pill-gain" id="ihsgGain">—</span>
      </div>
    </div>
  </div>

  <div class="page-body">

    <!-- Ticker row -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
      <div class="chart-ticker-input-wrap">
        <span style="color:var(--muted);font-size:13px">⌕</span>
        <input type="text" class="chart-ticker-input" id="tickerInput" value="BBRI" placeholder="Ticker..." maxlength="8" autocomplete="off"/>
      </div>
      <button class="action-btn" id="loadBtn" onclick="doLoad()" style="padding:9px 18px;font-size:13px;font-weight:600">Load</button>
      <div style="width:1px;height:28px;background:var(--border)"></div>
      <div>
        <div style="font-size:12px;color:var(--muted)" id="tName">—</div>
        <div style="display:flex;align-items:baseline;gap:8px">
          <div style="font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--ink)" id="tPrice">—</div>
          <div style="font-family:var(--font-mono);font-size:13px" id="tChg">—</div>
        </div>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
        <span style="font-size:11px;color:var(--muted)">Tanggal TX:</span>
        <div id="chartDatePicker"></div>
      </div>
    </div>

    <!-- Chart card -->
    <div class="chart-card" style="margin-bottom:14px;position:relative">
      <div class="chart-toolbar">
        <!-- TF selector -->
        <div class="tf-selector" id="tfSelector">
          <div class="tf-arrow" id="tfUp">▲</div>
          <div class="tf-curr" id="tfLabel">1D</div>
          <div class="tf-arrow" id="tfDn">▼</div>
        </div>
        <div style="width:1px;height:20px;background:var(--border)"></div>
        <span style="font-size:11.5px;color:var(--muted)">Overlay:</span>
        <div class="ovl-btn active" id="ovlBtnCM" onclick="toggleOverlay('cm')" style="--ovl-col:#3a6b58"><div class="ovl-dot" style="background:#3a6b58"></div>CM</div>
        <div class="ovl-btn" id="ovlBtnSM" onclick="toggleOverlay('sm')" style="--ovl-col:#4a7fdb"><div class="ovl-dot" style="background:#4a7fdb"></div>SM</div>
        <div class="ovl-btn" id="ovlBtnBM" onclick="toggleOverlay('bm')" style="--ovl-col:#c87d3a"><div class="ovl-dot" style="background:#c87d3a"></div>BM</div>
        <div style="flex:1"></div>
        <div class="scale-toggle">
          <div class="scale-btn active" id="btnAuto" onclick="setScale('auto')" title="Auto scale">A</div>
          <div class="scale-btn" id="btnLog"  onclick="setScale('log')"  title="Log scale">L</div>
        </div>
      </div>
      <!-- OHLC bar -->
      <div class="ohlc-bar">
        <span id="ohlcTicker" style="color:var(--muted)">—</span>
        <span class="ohlc-sep">|</span>
        <span><span class="ohlc-l">O</span><span class="ohlc-v" id="htOpen">—</span></span>
        <span><span class="ohlc-l">H</span><span class="ohlc-v up" id="htHigh">—</span></span>
        <span><span class="ohlc-l">L</span><span class="ohlc-v down" id="htLow">—</span></span>
        <span><span class="ohlc-l">C</span><span class="ohlc-v" id="htClose">—</span></span>
        <span class="ohlc-sep">|</span>
        <span><span class="ohlc-l">Vol</span><span class="ohlc-v" id="htVol">—</span></span>
      </div>
      <!-- Chart -->
      <div id="chartArea"></div>
      <!-- Loading overlay -->
      <div class="chart-loading" id="chartLoading">
        <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
          <div class="spinner-sm"></div>
          <div style="font-size:13px;color:var(--muted)" id="chartLoadMsg">Loading...</div>
        </div>
      </div>
    </div>

    <!-- Metrics strip -->
    <div class="metrics-strip" style="margin-bottom:14px">
      <div class="metric-cell"><div class="metric-lbl">Avg SM</div><div class="metric-val" id="mpAvgSM" style="color:var(--up)">—</div></div>
      <div class="metric-cell"><div class="metric-lbl">Avg BM</div><div class="metric-val" id="mpAvgBM" style="color:var(--down)">—</div></div>
      <div class="metric-cell"><div class="metric-lbl">ATR%</div><div class="metric-val" id="mpATR">—</div></div>
      <div class="metric-cell"><div class="metric-lbl">SRI</div><div class="metric-val" id="mpSRI">—</div></div>
      <div class="metric-cell"><div class="metric-lbl">MES</div><div class="metric-val" id="mpMES">—</div></div>
      <div class="metric-cell"><div class="metric-lbl">RPR</div><div class="metric-val" id="mpRPR">—</div></div>
      <div class="metric-cell"><div class="metric-lbl">Vx Gap</div><div class="metric-val" id="mpVXG">—</div></div>
      <div class="metric-cell"><div class="metric-lbl">Phase · Action</div><div id="mpPhaseBadge" style="margin-top:4px">—</div></div>
    </div>

    <!-- Transaction tables -->
    <div class="trx-tables">
      <div class="trx-table-card">
        <div class="trx-head">
          <div class="trx-dot" style="background:#3a6b58"></div>
          <div class="trx-title" style="color:#3a6b58">Smart Money</div>
          <div class="trx-cnt" id="smCount"></div>
        </div>
        <div class="trx-scroll">
          <table class="trx-table">
            <thead><tr><th class="trx-th" style="text-align:left">WAKTU</th><th class="trx-th">HARGA</th><th class="trx-th">GAIN</th><th class="trx-th">VAL</th><th class="trx-th">VOLX</th></tr></thead>
            <tbody id="smBody"><tr><td colspan="5" style="padding:20px;text-align:center;color:var(--muted);font-size:12px">—</td></tr></tbody>
          </table>
        </div>
      </div>
      <div class="trx-table-card">
        <div class="trx-head">
          <div class="trx-dot" style="background:#c87d3a"></div>
          <div class="trx-title" style="color:#c87d3a">Bad Money</div>
          <div class="trx-cnt" id="bmCount"></div>
        </div>
        <div class="trx-scroll">
          <table class="trx-table">
            <thead><tr><th class="trx-th" style="text-align:left">WAKTU</th><th class="trx-th">HARGA</th><th class="trx-th">GAIN</th><th class="trx-th">VAL</th><th class="trx-th">VOLX</th></tr></thead>
            <tbody id="bmBody"><tr><td colspan="5" style="padding:20px;text-align:center;color:var(--muted);font-size:12px">—</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

  </div><!-- /page-body -->
</div><!-- /main-content -->

<script src="/static/zenith-utils.js"></script>
<script>
(function(){
var TF_LIST = ['5m','15m','30m','1h','1d'];
var currentTicker = 'BBRI', currentTF = '1d';
var isLogScale = false, isAutoScale = true;
var INIT_CANDLES = 150;
var prevCloseMap = {};
var chart = null, candleSeries = null, volumeSeries = null;
var ovlSeriesCM = null, ovlSeriesSM = null, ovlSeriesBM = null;
var ovlShowCM = true, ovlShowSM = false, ovlShowBM = false;
var overlayDataCache = [];

var txDateFrom = '', txDateTo = '';
function isoToAPI(iso){ if(!iso)return''; var p=iso.split('-'); return p[2]+'-'+p[1]+'-'+p[0]; }
function fmtM(v){if(v==null)return'—';var a=Math.abs(v),s=v<0?'-':'';if(a>=1000)return s+(a/1000).toFixed(1)+'B';if(a>=1)return s+a.toFixed(1)+'M';if(a>0)return s+(a*1000).toFixed(0)+'K';return'0';}
function fmtMsign(v){if(v==null)return'—';var a=Math.abs(v),s=v<0?'-':'';if(a>=1000)return (v>0?'+':s)+(a/1000).toFixed(1)+'B';if(a>=1)return (v>0?'+':s)+a.toFixed(1)+'M';return (v>0?'+':s)+(a*1000).toFixed(0)+'K';}

/* IHSG */
window.loadIHSGBadge(document.getElementById('ihsgPrice'), document.getElementById('ihsgGain'));

/* TF Selector */
function updateTFUI() {
  var idx = TF_LIST.indexOf(currentTF);
  document.getElementById('tfLabel').textContent = currentTF.toUpperCase();
  document.getElementById('tfUp').classList.toggle('disabled', idx >= TF_LIST.length - 1);
  document.getElementById('tfDn').classList.toggle('disabled', idx <= 0);
}
document.getElementById('tfUp').addEventListener('click', function() {
  var idx = TF_LIST.indexOf(currentTF);
  if (idx < TF_LIST.length - 1) { currentTF = TF_LIST[idx+1]; updateTFUI(); setTF(currentTF); }
});
document.getElementById('tfDn').addEventListener('click', function() {
  var idx = TF_LIST.indexOf(currentTF);
  if (idx > 0) { currentTF = TF_LIST[idx-1]; updateTFUI(); setTF(currentTF); }
});
updateTFUI();

function setTF(tf) {
  currentTF = tf; updateTFUI();
  if (chart) { chart.remove(); chart = null; candleSeries = null; volumeSeries = null; ovlSeriesCM = null; ovlSeriesSM = null; ovlSeriesBM = null; }
  doLoad();
}

/* Overlays */
document.getElementById('ovlBtnCM').addEventListener('click', function(){ toggleOverlay('cm'); });
document.getElementById('ovlBtnSM').addEventListener('click', function(){ toggleOverlay('sm'); });
document.getElementById('ovlBtnBM').addEventListener('click', function(){ toggleOverlay('bm'); });

function toggleOverlay(which) {
  if (which==='cm') { ovlShowCM=!ovlShowCM; document.getElementById('ovlBtnCM').classList.toggle('active',ovlShowCM); if(ovlSeriesCM) ovlSeriesCM.applyOptions({visible:ovlShowCM}); }
  else if (which==='sm') { ovlShowSM=!ovlShowSM; document.getElementById('ovlBtnSM').classList.toggle('active',ovlShowSM); if(ovlSeriesSM) ovlSeriesSM.applyOptions({visible:ovlShowSM}); }
  else { ovlShowBM=!ovlShowBM; document.getElementById('ovlBtnBM').classList.toggle('active',ovlShowBM); if(ovlSeriesBM) ovlSeriesBM.applyOptions({visible:ovlShowBM}); }
}

/* Scale */
function applyAutoScale(on) { if(!chart) return; chart.priceScale('right').applyOptions({autoScale:on,scaleMargins:{top:0.1,bottom:0.2}}); }
function setScale(mode) {
  if (mode==='auto') { isAutoScale=!isAutoScale; applyAutoScale(isAutoScale); document.getElementById('btnAuto').classList.toggle('active',isAutoScale); }
  else { isLogScale=!isLogScale; if(chart) chart.applyOptions({rightPriceScale:{mode:isLogScale?1:0}}); document.getElementById('btnLog').classList.toggle('active',isLogScale); }
}

function getDateStr() { return isoToAPI(txDateFrom); }
function getDateToStr() { return isoToAPI(txDateTo || txDateFrom); }
function reloadChartData() { loadMetrics(); loadTransactions(); }

/* Chart init */
function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }
function initChart() {
  var container = document.getElementById('chartArea');
  var chartH = Math.max(420, window.innerHeight - 250);
  container.style.height = chartH + 'px';
  var dark = isDark();
  chart = LightweightCharts.createChart(container, {
    width: container.offsetWidth,
    height: chartH,
    layout: {
      background: { type: 'solid', color: dark ? '#0e1318' : '#fafaf7' },
      textColor: dark ? '#6a8090' : '#7a7060',
      fontFamily: "'Geist Mono', monospace",
    },
    grid: {
      vertLines: { color: dark ? 'rgba(255,255,255,.04)' : 'rgba(0,0,0,.04)' },
      horzLines: { color: dark ? 'rgba(255,255,255,.04)' : 'rgba(0,0,0,.04)' },
    },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: dark ? '#1a2230' : '#e5e0d8' },
    timeScale: {
      borderColor: dark ? '#1a2230' : '#e5e0d8',
      timeVisible: true,
      tickMarkFormatter: function(t) {
        var d = new Date(t*1000);
        var h = String(d.getUTCHours()).padStart(2,'0'), m = String(d.getUTCMinutes()).padStart(2,'0');
        var day = d.getUTCDate(), mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()];
        return currentTF==='1d' ? (day+' '+mon) : (h+':'+m);
      }
    },
    localization: { priceFormatter: function(p){ return Math.round(p).toLocaleString('id-ID'); } },
    handleScroll: true, handleScale: true,
  });
  candleSeries = chart.addCandlestickSeries({
    upColor: '#3a6b58', downColor: '#c8633a',
    borderUpColor: '#3a6b58', borderDownColor: '#c8633a',
    wickUpColor: '#3a6b58', wickDownColor: '#c8633a',
  });
  volumeSeries = chart.addHistogramSeries({ color: '#1a2230', priceFormat:{type:'volume'}, priceScaleId:'volume', scaleMargins:{top:0.85,bottom:0} });
  chart.priceScale('volume').applyOptions({ scaleMargins:{top:0.85,bottom:0} });
  chart.priceScale('overlay').applyOptions({ scaleMargins:{top:0.05,bottom:0.2}, visible:false, autoScale:true });
  ovlSeriesCM = chart.addLineSeries({ color:'#3a6b58', lineWidth:2, priceScaleId:'overlay', lastValueVisible:false, priceLineVisible:false });
  ovlSeriesSM = chart.addLineSeries({ color:'#4a7fdb', lineWidth:1.5, priceScaleId:'overlay', lastValueVisible:false, priceLineVisible:false });
  ovlSeriesBM = chart.addLineSeries({ color:'#c87d3a', lineWidth:1.5, priceScaleId:'overlay', lastValueVisible:false, priceLineVisible:false });
  ovlSeriesCM.applyOptions({visible:ovlShowCM}); ovlSeriesSM.applyOptions({visible:ovlShowSM}); ovlSeriesBM.applyOptions({visible:ovlShowBM});

  chart.subscribeCrosshairMove(function(param) {
    if (!param.time || !param.seriesData) return;
    var bar = param.seriesData.get(candleSeries);
    if (!bar) return;
    var fmt = function(v){ return Math.round(v).toLocaleString('id-ID'); };
    document.getElementById('htOpen').textContent  = fmt(bar.open);
    document.getElementById('htHigh').textContent  = fmt(bar.high);
    document.getElementById('htLow').textContent   = fmt(bar.low);
    document.getElementById('htClose').textContent = fmt(bar.close);
    var vb = param.seriesData.get(volumeSeries);
    if (vb) { var v=vb.value; document.getElementById('htVol').textContent = v>=1e9?(v/1e9).toFixed(1)+'B':v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(1)+'K':String(v); }
  });

  applyAutoScale(isAutoScale);
  var ro = new ResizeObserver(function(){ if(chart) chart.applyOptions({width:container.offsetWidth}); });
  ro.observe(container);
}

/* Load OHLCV */
function showLoad(msg) { var el = document.getElementById('chartLoading'); el.classList.add('visible'); document.getElementById('chartLoadMsg').textContent = msg||'Loading...'; }
function hideLoad() { document.getElementById('chartLoading').classList.remove('visible'); }

async function doLoad() {
  var input = document.getElementById('tickerInput').value.trim().toUpperCase();
  if (!input) return;
  currentTicker = input;
  document.getElementById('ohlcTicker').textContent = currentTicker + ' · ' + currentTF.toUpperCase();
  showLoad('Mengambil data...');
  if (chart) { chart.remove(); chart=null; candleSeries=null; volumeSeries=null; ovlSeriesCM=null; ovlSeriesSM=null; ovlSeriesBM=null; }
  initChart();
  try {
    var res = await fetch('/api/ohlcv?ticker='+encodeURIComponent(currentTicker)+'&tf='+encodeURIComponent(currentTF));
    var data = await res.json();
    if (data.error) throw new Error(data.error);
    var candles = data.candles || [];
    if (!candles.length) throw new Error('Data kosong');
    prevCloseMap = {};
    for (var i=0; i<candles.length; i++) prevCloseMap[candles[i].time] = i>0 ? candles[i-1].close : candles[i].open;
    candleSeries.setData(candles);
    volumeSeries.setData(candles.map(function(c){ return {time:c.time, value:c.volume||0, color:(c.close>=c.open)?'rgba(58,107,88,.25)':'rgba(200,99,58,.25)'}; }));
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      if (candles.length > INIT_CANDLES) chart.timeScale().setVisibleLogicalRange({from:candles.length-INIT_CANDLES,to:candles.length-1});
      else chart.timeScale().fitContent();
    }); });
    applyAutoScale(isAutoScale);
    hideLoad();
    var last = candles[candles.length-1];
    var prev = candles[candles.length-2];
    document.getElementById('htOpen').textContent  = Math.round(last.open).toLocaleString('id-ID');
    document.getElementById('htHigh').textContent  = Math.round(last.high).toLocaleString('id-ID');
    document.getElementById('htLow').textContent   = Math.round(last.low).toLocaleString('id-ID');
    document.getElementById('htClose').textContent = Math.round(last.close).toLocaleString('id-ID');
    if (data.name) document.getElementById('tName').textContent = data.name;
    document.getElementById('tPrice').textContent = Math.round(last.close).toLocaleString('id-ID');
    if (prev) {
      var chg = ((last.close-prev.close)/prev.close*100).toFixed(2);
      var chgEl = document.getElementById('tChg');
      chgEl.textContent = (chg>=0?'+':'')+chg+'%';
      chgEl.style.color = chg>=0 ? 'var(--up)' : 'var(--down)';
    }
    loadOverlayData(candles);
    loadTransactions();
    loadMetrics();
  } catch(err) { hideLoad(); }
}

/* Overlay */
async function loadOverlayData(candles) {
  if (!chart || !ovlSeriesCM) return;
  try {
    var res = await fetch('/api/overlay?ticker='+encodeURIComponent(currentTicker)+'&tf='+encodeURIComponent(currentTF));
    var data = await res.json();
    if (data.error || !data.points || !data.points.length) { ovlSeriesCM.setData([]); ovlSeriesSM.setData([]); ovlSeriesBM.setData([]); return; }
    var candleArr = candles.map(function(c){ return c.time; }).sort(function(a,b){return a-b;});
    var candleTimes = {};
    candleArr.forEach(function(t){ candleTimes[t] = true; });
    function snapTime(t) {
      if (candleTimes[t]) return t;
      var best = null, bestDist = Infinity;
      for (var j=0; j<candleArr.length; j++) { var dist=Math.abs(candleArr[j]-t); if(dist<bestDist){bestDist=dist;best=candleArr[j];} if(candleArr[j]>t)break; }
      return best;
    }
    var ovlMap = {};
    data.points.forEach(function(p){ var st=snapTime(p.time); if(st&&!ovlMap[st])ovlMap[st]=p; });
    var cmD=[], smD=[], bmD=[];
    overlayDataCache = [];
    var lastCum = {cm:0,sm:0,bm:0};
    candleArr.forEach(function(ct) {
      var ovl = ovlMap[ct];
      if (ovl) { lastCum={cm:ovl.cum_cm,sm:ovl.cum_sm,bm:ovl.cum_bm}; overlayDataCache.push({time:ct,cm:ovl.cm,sm:ovl.sm,bm:ovl.bm}); }
      else overlayDataCache.push({time:ct,cm:0,sm:0,bm:0});
      cmD.push({time:ct,value:lastCum.cm}); smD.push({time:ct,value:lastCum.sm}); bmD.push({time:ct,value:lastCum.bm});
    });
    ovlSeriesCM.setData(cmD); ovlSeriesSM.setData(smD); ovlSeriesBM.setData(bmD);
  } catch(_) { overlayDataCache = []; }
}

/* Metrics */
async function loadMetrics() {
  try {
    var ds = getDateStr(); if (!ds) return;
    var res = await fetch('/api/flow?date_from='+encodeURIComponent(ds)+'&date_to='+encodeURIComponent(getDateToStr()));
    var d = await res.json();
    if (!d.tickers) return;
    var r = d.tickers.find(function(t){return t.ticker===currentTicker;});
    if (!r) return;
    var fmt = function(v){ return v!=null?v.toLocaleString('id-ID'):'—'; };
    document.getElementById('mpAvgSM').textContent = r.vwap_sm ? fmt(r.vwap_sm) : '—';
    document.getElementById('mpAvgBM').textContent = r.vwap_bm ? fmt(r.vwap_bm) : '—';
    document.getElementById('mpATR').textContent   = r.atr_pct  ? r.atr_pct.toFixed(1)+'%' : '—';
    document.getElementById('mpSRI').textContent   = r.sri      ? r.sri.toFixed(2) : '—';
    document.getElementById('mpMES').textContent   = r.mes      ? r.mes.toFixed(2) : '—';
    document.getElementById('mpRPR').textContent   = r.rpr      ? r.rpr.toFixed(2) : '—';
    var vxg = document.getElementById('mpVXG');
    vxg.textContent = r.volx_gap!=null ? r.volx_gap.toFixed(2)+'%' : '—';
    vxg.style.color = r.volx_gap!=null ? (r.volx_gap<-1.5?'var(--up)':r.volx_gap>1.5?'var(--down)':'var(--text)') : 'var(--text)';
    var pbEl = document.getElementById('mpPhaseBadge');
    pbEl.innerHTML = (r.phase ? window.phaseBadgeHTML(r.phase) : '') + (r.action ? ' ' + window.actionBadgeHTML(r.action) : '');
  } catch(_) {}
}

/* Transactions */
async function loadTransactions() {
  var df = isoToAPI(txDateFrom);
  if (!df) return;
  var dt = isoToAPI(txDateTo || txDateFrom);
  var url = '/api/transactions?ticker='+encodeURIComponent(currentTicker)+'&date_from='+encodeURIComponent(df)+'&date_to='+encodeURIComponent(dt);
  function buildRows(rows, col) {
    if (!rows.length) return '<tr><td colspan="5" style="padding:20px;text-align:center;color:var(--muted);font-size:12px">Tidak ada data</td></tr>';
    return rows.map(function(r){
      var g = r.gain_pct; var gc = g!=null?(g>=0?'var(--up)':'var(--down)'):'var(--text-dim)';
      return '<tr class="trx-row">'+
        '<td class="trx-td">'+(r.time||'—')+'</td>'+
        '<td class="trx-td">'+(r.price?Math.round(r.price).toLocaleString('id-ID'):'—')+'</td>'+
        '<td class="trx-td" style="color:'+gc+'">'+(g!=null?(g>=0?'+':'')+g.toFixed(2)+'%':'—')+'</td>'+
        '<td class="trx-td" style="color:'+col+'">'+fmtM(r.mf_num)+'</td>'+
        '<td class="trx-td">'+(r.vol_x?r.vol_x.toFixed(1)+'×':'—')+'</td>'+
        '</tr>';
    }).join('');
  }
  try {
    var res = await fetch(url); var data = await res.json();
    if (data.error) throw new Error(data.error);
    document.getElementById('smCount').textContent = '('+data.sm_count+'TX)';
    document.getElementById('bmCount').textContent = '('+data.bm_count+'TX)';
    document.getElementById('smBody').innerHTML = buildRows(data.sm||[], '#3a6b58');
    document.getElementById('bmBody').innerHTML = buildRows(data.bm||[], '#c87d3a');
  } catch(e) {
    var err = '<tr><td colspan="5" style="padding:20px;text-align:center;color:var(--down);font-size:12px">Gagal memuat data</td></tr>';
    document.getElementById('smBody').innerHTML = err; document.getElementById('bmBody').innerHTML = err;
  }
}

/* Scale and load button event listeners (setScale is inside IIFE, not global) */
document.getElementById('btnAuto').addEventListener('click', function(){ setScale('auto'); });
document.getElementById('btnLog').addEventListener('click',  function(){ setScale('log'); });
document.getElementById('loadBtn').addEventListener('click', function(){ doLoad(); });

/* Dark mode observer — update chart colors when theme toggles */
new MutationObserver(function(mutations) {
  mutations.forEach(function(m) {
    if (m.attributeName !== 'data-theme' || !chart) return;
    var dark = isDark();
    chart.applyOptions({
      layout: {
        background: { type: 'solid', color: dark ? '#0e1318' : '#fafaf7' },
        textColor:  dark ? '#6a8090' : '#7a7060',
      },
      grid: {
        vertLines: { color: dark ? 'rgba(255,255,255,.04)' : 'rgba(0,0,0,.04)' },
        horzLines: { color: dark ? 'rgba(255,255,255,.04)' : 'rgba(0,0,0,.04)' },
      },
      rightPriceScale: { borderColor: dark ? '#1a2230' : '#e5e0d8' },
      timeScale:       { borderColor: dark ? '#1a2230' : '#e5e0d8' },
    });
  });
}).observe(document.documentElement, { attributes: true });

/* Init */
document.getElementById('tickerInput').addEventListener('keydown', function(e){ if(e.key==='Enter') doLoad(); });
window.addEventListener('DOMContentLoaded', async function() {
  var initDate = window.todayLocal();
  try { var r = await fetch('/api/last-date'); var d = await r.json(); if(d.date) initDate = window.DD_MM_YYYYtoISO(d.date.replace(/\//g,'-')); } catch(_) {}
  txDateFrom = initDate; txDateTo = initDate;

  /* Date picker */
  var sdp = new window.StockbitDatePicker('chartDatePicker', {
    from: initDate, to: initDate,
    onChange: function(from, to) { txDateFrom = from; txDateTo = to || from; reloadChartData(); }
  });

  /* Check URL param */
  var params = new URLSearchParams(location.search);
  var pt = params.get('ticker');
  if (pt) document.getElementById('tickerInput').value = pt.toUpperCase();
  initChart();
  doLoad();
});
})();
</script>
